<svg width="900" height="330" viewBox="0 0 900 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cyber terminal intro for sunzrnobug</title>
  <desc id="desc">Animated terminal typing TypeScript, Electron, React, commit graph, and shipping status.</desc>

  <defs>
    <linearGradient id="frame" x1="40" y1="34" x2="860" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.52" stop-color="#0f766e" />
      <stop offset="1" stop-color="#a855f7" />
    </linearGradient>

    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(450 165) rotate(90) scale(230 520)">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.23" />
      <stop offset="1" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-40%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#22d3ee" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#0f766e" flood-opacity="0.35" />
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#22d3ee" stroke-opacity="0.08" />
    </pattern>

    <pattern id="scanline" width="900" height="8" patternUnits="userSpaceOnUse">
      <rect width="900" height="1.2" fill="#ffffff" opacity="0.06" />
    </pattern>

    <clipPath id="line1Clip">
      <rect x="82" y="108" width="0" height="26">
        <animate attributeName="width" dur="10s" repeatCount="indefinite" values="0;0;470;470;0" keyTimes="0;0.06;0.24;0.92;1" calcMode="linear" />
      </rect>
    </clipPath>

    <clipPath id="line2Clip">
      <rect x="82" y="148" width="0" height="26">
        <animate attributeName="width" dur="10s" repeatCount="indefinite" values="0;0;610;610;0" keyTimes="0;0.27;0.45;0.92;1" calcMode="linear" />
      </rect>
    </clipPath>

    <clipPath id="line3Clip">
      <rect x="82" y="188" width="0" height="26">
        <animate attributeName="width" dur="10s" repeatCount="indefinite" values="0;0;500;500;0" keyTimes="0;0.48;0.64;0.92;1" calcMode="linear" />
      </rect>
    </clipPath>

    <clipPath id="line4Clip">
      <rect x="82" y="228" width="0" height="26">
        <animate attributeName="width" dur="10s" repeatCount="indefinite" values="0;0;620;620;0" keyTimes="0;0.67;0.86;0.92;1" calcMode="linear" />
      </rect>
    </clipPath>

    <style>
      .mono {
        font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
        font-size: 20px;
        letter-spacing: 0;
      }

      .small {
        font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
        font-size: 13px;
        letter-spacing: 0;
      }

      .prompt {
        fill: #22d3ee;
        filter: url(#softGlow);
      }

      .cmd {
        fill: #d1fae5;
      }

      .accent {
        fill: #a7f3d0;
      }

      .muted {
        fill: #94a3b8;
      }

      .cursor {
        animation: blink 1s steps(2, start) infinite;
      }

      .scan {
        animation: drift 8s linear infinite;
      }

      .pulse {
        animation: pulse 2.4s ease-in-out infinite;
      }

      @keyframes blink {
        0%, 42% { opacity: 1; }
        43%, 100% { opacity: 0; }
      }

      @keyframes drift {
        from { transform: translateY(-16px); }
        to { transform: translateY(16px); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="900" height="330" rx="18" fill="#020617" />
  <rect width="900" height="330" fill="url(#grid)" />
  <rect width="900" height="330" fill="url(#glowA)" />

  <g class="scan">
    <rect width="900" height="330" fill="url(#scanline)" />
  </g>

  <rect x="42" y="36" width="816" height="258" rx="14" fill="#020617" fill-opacity="0.86" stroke="url(#frame)" stroke-width="1.4" />
  <rect x="43" y="37" width="814" height="42" rx="13" fill="#07111f" fill-opacity="0.92" />
  <line x1="43" y1="79" x2="857" y2="79" stroke="#22d3ee" stroke-opacity="0.22" />

  <circle cx="68" cy="58" r="6" fill="#ef4444" />
  <circle cx="90" cy="58" r="6" fill="#f59e0b" />
  <circle cx="112" cy="58" r="6" fill="#10b981" />

  <text x="450" y="63" text-anchor="middle" class="small muted">/dev/profile/sunzrnobug</text>
  <text x="760" y="63" text-anchor="end" class="small prompt pulse">ONLINE</text>

  <g clip-path="url(#line1Clip)">
    <text x="82" y="128" class="mono">
      <tspan class="prompt">sunzrnobug@github</tspan><tspan class="muted">:</tspan><tspan class="accent">~</tspan><tspan class="muted">$ </tspan><tspan class="cmd">init --profile</tspan>
    </text>
  </g>

  <g clip-path="url(#line2Clip)">
    <text x="82" y="168" class="mono">
      <tspan class="prompt">&gt;</tspan><tspan class="cmd"> stack.load("</tspan><tspan class="accent">TypeScript</tspan><tspan class="cmd">", "</tspan><tspan class="accent">Electron</tspan><tspan class="cmd">", "</tspan><tspan class="accent">React</tspan><tspan class="cmd">")</tspan>
    </text>
  </g>

  <g clip-path="url(#line3Clip)">
    <text x="82" y="208" class="mono">
      <tspan class="prompt">&gt;</tspan><tspan class="cmd"> commits.sync --graph live --daily</tspan>
    </text>
  </g>

  <g clip-path="url(#line4Clip)">
    <text x="82" y="248" class="mono">
      <tspan class="prompt">&gt;</tspan><tspan class="cmd"> status: shipping useful desktop tools</tspan>
    </text>
  </g>

  <rect x="82" y="262" width="12" height="22" rx="2" fill="#22d3ee" class="cursor" filter="url(#softGlow)" />

  <path d="M676 112H818M676 152H786M676 192H832M676 232H768" stroke="#22d3ee" stroke-opacity="0.16" />
  <path d="M676 112H742M676 152H804M676 192H728M676 232H812" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" filter="url(#softGlow)" opacity="0.78" />

  <rect x="42" y="36" width="816" height="258" rx="14" stroke="#ffffff" stroke-opacity="0.08" />
</svg>
