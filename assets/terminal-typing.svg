<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Terminal profile intro</title>
  <desc id="desc">A quiet terminal-style introduction for sunzrnobug and geospatial engineering work.</desc>

  <defs>
    <linearGradient id="frame" x1="44" y1="34" x2="856" y2="266" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" />
      <stop offset="0.58" stop-color="#0f766e" />
      <stop offset="1" stop-color="#64748b" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(450 150) rotate(90) scale(210 460)">
      <stop stop-color="#22d3ee" stop-opacity="0.16" />
      <stop offset="1" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#22d3ee" stroke-opacity="0.055" />
    </pattern>
    <filter id="softGlow" x="-30%" y="-40%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#22d3ee" flood-opacity="0.55" />
    </filter>
    <clipPath id="line1Clip">
      <rect x="82" y="104" width="0" height="26">
        <animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;210;210;0" keyTimes="0;0.06;0.16;0.9;1" />
      </rect>
    </clipPath>
    <clipPath id="line2Clip">
      <rect x="82" y="140" width="0" height="26">
        <animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;470;470;0" keyTimes="0;0.18;0.33;0.9;1" />
      </rect>
    </clipPath>
    <clipPath id="line3Clip">
      <rect x="82" y="176" width="0" height="26">
        <animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;360;360;0" keyTimes="0;0.36;0.52;0.9;1" />
      </rect>
    </clipPath>
    <clipPath id="line4Clip">
      <rect x="82" y="212" width="0" height="26">
        <animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;590;590;0" keyTimes="0;0.55;0.74;0.9;1" />
      </rect>
    </clipPath>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, monospace; font-size: 19px; letter-spacing: 0; }
      .small { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, monospace; font-size: 12px; letter-spacing: 0; }
      .prompt { fill: #22d3ee; filter: url(#softGlow); }
      .cmd { fill: #d1fae5; }
      .muted { fill: #94a3b8; }
      .accent { fill: #86efac; }
      .cursor { animation: blink 1s steps(2, start) infinite; }
      @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="900" height="300" rx="18" fill="#020617" />
  <rect width="900" height="300" fill="url(#grid)" />
  <rect width="900" height="300" fill="url(#glow)" />
  <rect x="44" y="34" width="812" height="232" rx="14" fill="#020617" fill-opacity="0.88" stroke="url(#frame)" stroke-width="1.3" />
  <rect x="45" y="35" width="810" height="42" rx="13" fill="#07111f" fill-opacity="0.92" />
  <line x1="45" y1="77" x2="855" y2="77" stroke="#22d3ee" stroke-opacity="0.16" />

  <circle cx="68" cy="56" r="5.8" fill="#ef4444" />
  <circle cx="89" cy="56" r="5.8" fill="#f59e0b" />
  <circle cx="110" cy="56" r="5.8" fill="#10b981" />
  <text x="450" y="61" text-anchor="middle" class="small muted">~/workspace/profile</text>
  <text x="800" y="61" text-anchor="end" class="small muted">quiet mode</text>

  <g clip-path="url(#line1Clip)">
    <text x="82" y="124" class="mono"><tspan class="prompt">$</tspan><tspan class="cmd"> whoami</tspan></text>
  </g>
  <g clip-path="url(#line2Clip)">
    <text x="82" y="160" class="mono"><tspan class="muted">sunzrnobug</tspan><tspan class="accent"> / desktop + geospatial tools</tspan></text>
  </g>
  <g clip-path="url(#line3Clip)">
    <text x="82" y="196" class="mono"><tspan class="prompt">$</tspan><tspan class="cmd"> stack --current</tspan><tspan class="muted"> ts electron react</tspan></text>
  </g>
  <g clip-path="url(#line4Clip)">
    <text x="82" y="232" class="mono"><tspan class="prompt">$</tspan><tspan class="cmd"> status</tspan><tspan class="muted"> building Synapse and GeoScenario tooling</tspan></text>
  </g>

  <rect x="496" y="216" width="11" height="20" rx="2" fill="#22d3ee" class="cursor" filter="url(#softGlow)" />
</svg>
