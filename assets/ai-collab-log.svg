<svg width="900" height="320" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Claude and Codex collaboration log</title>
  <desc id="desc">A cyber terminal panel showing collaboration records with Claude and Codex.</desc>

  <defs>
    <linearGradient id="border" x1="36" y1="30" x2="864" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" />
      <stop offset="0.48" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#10b981" />
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(450 160) rotate(90) scale(230 520)">
      <stop stop-color="#22d3ee" stop-opacity="0.2" />
      <stop offset="1" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <filter id="neon" x="-30%" y="-40%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#22d3ee" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#8b5cf6" flood-opacity="0.28" />
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#22d3ee" stroke-opacity="0.07" />
    </pattern>

    <pattern id="scanline" width="900" height="8" patternUnits="userSpaceOnUse">
      <rect width="900" height="1.2" fill="#ffffff" opacity="0.055" />
    </pattern>

    <clipPath id="claudeClip">
      <rect x="70" y="112" width="0" height="105">
        <animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;350;350;0" keyTimes="0;0.08;0.34;0.92;1" calcMode="linear" />
      </rect>
    </clipPath>

    <clipPath id="codexClip">
      <rect x="480" y="112" width="0" height="105">
        <animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;350;350;0" keyTimes="0;0.38;0.7;0.92;1" calcMode="linear" />
      </rect>
    </clipPath>

    <style>
      .mono {
        font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
        letter-spacing: 0;
      }

      .title {
        font-size: 22px;
        font-weight: 700;
        fill: #f8fafc;
      }

      .label {
        font-size: 16px;
        font-weight: 700;
      }

      .line {
        font-size: 15px;
        font-weight: 500;
        fill: #cbd5e1;
      }

      .small {
        font-size: 12px;
        fill: #94a3b8;
      }

      .cyan {
        fill: #22d3ee;
      }

      .violet {
        fill: #c084fc;
      }

      .green {
        fill: #86efac;
      }

      .muted {
        fill: #94a3b8;
      }

      .cursor {
        animation: blink 1s steps(2, start) infinite;
      }

      .scan {
        animation: drift 7s linear infinite;
      }

      .pulse {
        animation: pulse 2.5s ease-in-out infinite;
      }

      @keyframes blink {
        0%, 44% { opacity: 1; }
        45%, 100% { opacity: 0; }
      }

      @keyframes drift {
        from { transform: translateY(-18px); }
        to { transform: translateY(18px); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.36; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="900" height="320" rx="18" fill="#020617" />
  <rect width="900" height="320" fill="url(#grid)" />
  <rect width="900" height="320" fill="url(#glow)" />
  <g class="scan">
    <rect width="900" height="320" fill="url(#scanline)" />
  </g>

  <rect x="36" y="30" width="828" height="260" rx="16" fill="#020617" fill-opacity="0.86" stroke="url(#border)" stroke-width="1.5" />
  <rect x="37" y="31" width="826" height="46" rx="15" fill="#07111f" fill-opacity="0.95" />
  <line x1="37" y1="77" x2="863" y2="77" stroke="#22d3ee" stroke-opacity="0.18" />

  <circle cx="62" cy="54" r="6" fill="#ef4444" />
  <circle cx="84" cy="54" r="6" fill="#f59e0b" />
  <circle cx="106" cy="54" r="6" fill="#10b981" />

  <text x="450" y="60" text-anchor="middle" class="mono small">ai-collab://claude+codex/session</text>
  <text x="820" y="60" text-anchor="end" class="mono small cyan pulse">SYNCED</text>

  <text x="70" y="105" class="mono label violet" filter="url(#neon)">CLAUDE // reasoning lane</text>
  <text x="480" y="105" class="mono label cyan" filter="url(#neon)">CODEX // shipping lane</text>

  <g clip-path="url(#claudeClip)">
    <text x="70" y="136" class="mono line">
      <tspan class="violet">&gt;</tspan><tspan> map vague ideas into product shape</tspan>
    </text>
    <text x="70" y="164" class="mono line">
      <tspan class="violet">&gt;</tspan><tspan> pressure-test UX and system choices</tspan>
    </text>
    <text x="70" y="192" class="mono line">
      <tspan class="violet">&gt;</tspan><tspan> turn notes into clearer direction</tspan>
    </text>
  </g>

  <g clip-path="url(#codexClip)">
    <text x="480" y="136" class="mono line">
      <tspan class="cyan">&gt;</tspan><tspan> edit files, wire workflows, push code</tspan>
    </text>
    <text x="480" y="164" class="mono line">
      <tspan class="cyan">&gt;</tspan><tspan> automate profile assets and actions</tspan>
    </text>
    <text x="480" y="192" class="mono line">
      <tspan class="cyan">&gt;</tspan><tspan> verify links, runs, and render paths</tspan>
    </text>
  </g>

  <rect x="70" y="226" width="760" height="38" rx="9" fill="#07111f" fill-opacity="0.72" stroke="#22d3ee" stroke-opacity="0.16" />
  <text x="88" y="250" class="mono small">
    <tspan class="green">record.latest</tspan><tspan class="muted"> = </tspan><tspan fill="#d1fae5">profile README redesigned with human + AI iteration</tspan>
  </text>
  <rect x="804" y="235" width="10" height="18" rx="2" fill="#22d3ee" class="cursor" filter="url(#neon)" />

  <path d="M436 118C424 142 424 178 436 202M454 118C466 142 466 178 454 202" stroke="#22d3ee" stroke-opacity="0.28" />
  <circle cx="445" cy="160" r="28" stroke="#8b5cf6" stroke-opacity="0.26" />
  <circle cx="445" cy="160" r="5" fill="#22d3ee" filter="url(#neon)" />
</svg>
