name: Generate contribution snake

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile source
        uses: actions/checkout@v4

      - name: Generate profile cards
        run: node scripts/generate-profile-cards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sunzrnobug
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=0f766e
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=22d3ee

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
